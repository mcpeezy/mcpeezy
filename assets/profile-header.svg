<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Patrick Gibbs — AI systems and full-stack software</title>
  <desc id="desc">Founder of Epiphany Dynamics. Built for the work after launch. Electric-blue type on a charcoal background with a terminal-inspired engineering motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c13"/>
      <stop offset="1" stop-color="#101d30"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48b5ff"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#68a4ef" stroke-width="0.7" opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="16" fill="url(#background)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>
  <path d="M16 2H1184" stroke="url(#blue)" stroke-width="4"/>
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">
    <text x="48" y="51" fill="#9fb4cf" font-size="15" letter-spacing="2.1">FOUNDER / EPIPHANY DYNAMICS</text>
    <text x="43" y="151" fill="url(#blue)" font-size="84" font-weight="700" letter-spacing="-5">PATRICK GIBBS</text>
    <text x="48" y="210" fill="#f1f5fb" font-size="26" letter-spacing="-0.8">AI systems. Full-stack software.</text>
    <text x="48" y="249" fill="#a8bbd3" font-size="22" letter-spacing="-0.5">Built for the work after launch.</text>
    <path d="M48 282H768" stroke="#263d58"/>
    <text x="48" y="318" fill="#8fabc9" font-size="15" letter-spacing="1.2">NASHVILLE, TN</text>
    <text x="768" y="318" text-anchor="end" fill="#5eb5ff" font-size="15">@mcpeezy</text>
    <rect x="825" y="62" width="327" height="235" rx="10" fill="#0a111d" stroke="#29496c"/>
    <path d="M825 101H1152" stroke="#233a55"/>
    <circle cx="846" cy="82" r="4" fill="#459eff"/>
    <circle cx="862" cy="82" r="4" fill="#31577f"/>
    <circle cx="878" cy="82" r="4" fill="#243f5d"/>
    <text x="1131" y="87" text-anchor="end" fill="#87a6ca" font-size="11" letter-spacing="1.1">THE WORK</text>
    <text x="850" y="141" fill="#5e9ad6" font-size="15">01 <tspan fill="#ccdaeb">understand()</tspan></text>
    <text x="850" y="175" fill="#5e9ad6" font-size="15">02 <tspan fill="#ccdaeb">build()</tspan></text>
    <text x="850" y="209" fill="#5e9ad6" font-size="15">03 <tspan fill="#ccdaeb">verify()</tspan></text>
    <text x="850" y="243" fill="#5e9ad6" font-size="15">04 <tspan fill="#ccdaeb">maintain()</tspan></text>
    <text x="850" y="277" fill="#3ca3ff" font-size="16">&gt;_</text>
    <path d="M1107 267h22" stroke="#3ca3ff" stroke-width="3"/>
  </g>
</svg>
